StylesPath = styles
MinAlertLevel = warning

# Blockquotes komplett überspringen:
# Wortgefecht-Zitate sind Primärquellen — nicht editierbar.
# Attribution-Zeilen (> — **Name**) ebenfalls.
SkippedScopes = script, style, pre, figure, blockquote

[*.md]
BasedOnStyles = gpunkt
# Citekeys aus dem Linting herausnehmen
# [@merkel_2010_01_01] soll nie geflaggt werden
TokenIgnores = (?s)\[@[a-z_0-9]+\]
